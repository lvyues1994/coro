name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            cxx: g++
            build_type: Debug
          - compiler: g++
            cxx: g++
            build_type: Release
          - compiler: clang++
            cxx: clang++
            build_type: Debug
            packages: clang
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # 库的最低要求是 C++14（上面的 build 作业）。这里用更新的标准把测试再编一遍、跑一遍：
  # 新标准带来的规则变化（弃用、C++20 的圆括号聚合初始化……）要在这里暴露，而不是在
  # 使用者那里。
  standards:
    name: ${{ matrix.compiler }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [17, 20, 23]
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCO2_TEST_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  libcxx:
    name: clang++ libc++ C++20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCO2_TEST_CXX_STANDARD=20

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  msvc:
    name: MSVC ${{ matrix.toolset }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest 自 2026-06 起是 VS 2026（v145）；windows-2022 保留 VS 2022（v143），
        # 覆盖仍在广泛使用的上一代工具集。include 只给组合补上可读的名字。
        os: [windows-latest, windows-2022]
        build_type: [Debug, Release]
        include:
          - os: windows-latest
            toolset: VS2026
          - os: windows-2022
            toolset: VS2022
    steps:
      - uses: actions/checkout@v4

      # Visual Studio 生成器是多配置的：配置阶段不指定类型，构建与测试时用 --config / -C。
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

  asan:
    name: ASan + UBSan (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1

  tsan:
    name: TSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
        env:
          TSAN_OPTIONS: second_deadlock_stack=1

      # 并发用例再重复跑几轮：丢唤醒、数据竞争这类问题一次运行未必碰得到。
      - name: Stress the concurrent tests
        run: |
          ctest --test-dir build --output-on-failure --timeout 300 \
            -R "thread-pool|when-all|spawn|callback|edge-case|scheduler" \
            --repeat until-fail:5
        env:
          TSAN_OPTIONS: second_deadlock_stack=1

  install:
    name: Install consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCO2_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/prefix"
          cmake --build build
          cmake --install build

      - name: Configure consumer
        run: |
          cmake -S tests/install_consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/prefix"

      - name: Build and run consumer
        run: |
          cmake --build build-consumer
          ./build-consumer/co2-install-consumer
